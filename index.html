<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Rock, Paper, Scissors Game</h1>
    <h3>Please choose. First one to win 5 rounds wins the game.</h3>
    <div class = "buttons">
        <button id = "rock">Rock</button>
        <button id = "paper">Paper</button>
        <button id = "scissors">Scissors</button>
    </div>
    <div>
        <p>Your choice: <span class = "user-choice"></span></p>
        <p>Computer's choice: <span class = "computer-choice"></span></p>
        <p id = "winner"></p>
    </div>
</body>
</html>
